<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad-A20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#f7fee7"/>
    </linearGradient>
    <filter id="shadow-A20" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Fondo degradado suave -->
  <rect width="400" height="300" rx="16" fill="url(#grad-A20)"/>
  
  <!-- Tarjeta interna blanca con sombra -->
  <rect x="25" y="25" width="350" height="250" rx="14" fill="#ffffff" filter="url(#shadow-A20)"/>

  <!-- Badge de ID -->
  <rect x="40" y="40" width="52" height="24" rx="6" fill="#1e3a8a"/>
  <text x="66" y="56" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A20</text>
  
  <!-- Icono / Emoji gráfico del producto -->
  <text x="200" y="145" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="70" text-anchor="middle">📐</text>
  
  <!-- Nombre oficial del producto -->
  <text x="200" y="205" font-family="'Segoe UI', -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#166534" text-anchor="middle">Juego Geométrico</text>
  
  <!-- Especificación técnica -->
  <text x="200" y="232" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">4 Piezas + Compás</text>
</svg>